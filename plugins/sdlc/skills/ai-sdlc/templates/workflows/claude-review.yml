# Automated PR review + @claude fix loop with claude-code-action.
# Easiest path on GitHub: run /install-github-app in Claude Code, which installs the app and a workflow for you.
# Use this file when you need control of the pipeline; check inputs against the current
# anthropics/claude-code-action README before relying on them.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request following REVIEW.md at the repo root.
            Find the change's intent/<change>/spec.md and plan.md and check the diff against them.
            Rank findings by severity (Important / Nit), tag each with its pass, and post them as review comments.

  fix-on-mention:
    if: >
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # With no prompt, the action responds to the @claude mention: addresses the comment and pushes the fix.
