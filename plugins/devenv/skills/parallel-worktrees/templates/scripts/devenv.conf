# Per-project settings for the parallel-worktrees dev environment.
# Sourced by scripts/lib.sh in the main checkout and in every worktree. Commit this file.

# Main checkout → http://$APP_DOMAIN, worktree <name> → http://<name>.$APP_DOMAIN
APP_DOMAIN=myapp.localhost

# Dev server. dev.sh exports PORT and puts node_modules/.bin on PATH. It MUST listen on exactly $PORT.
DEV_CMD='next dev --port $PORT'

# Install dependencies when node_modules is missing (fresh worktree). Empty = skip.
INSTALL_CMD='pnpm install --prefer-offline --silent'

# Shared services (DB, etc.) — ONE instance for all worktrees of this project.
# SERVICES_CHECK exits 0 when they're up; SERVICES_UP starts them. Empty = no services.
SERVICES_CHECK='nc -z 127.0.0.1 54329'
SERVICES_UP='docker compose up -d --wait'
NEEDS_DOCKER=1   # start Docker Desktop first if the daemon is down

# Run on every boot. Must be idempotent and safe if two worktrees boot at once. Empty = skip.
MIGRATE_CMD=''
